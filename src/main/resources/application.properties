spring.application.name=social-demo

# Kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/social_demo?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# JPA: bảng do schema.sql tạo, Hibernate không tự sửa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Chạy schema.sql và data.sql khi khởi động
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Thymeleaf: tắt cache khi đang phát triển
spring.thymeleaf.cache=false
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Social Demo'">Social Demo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- ============ THANH MENU TRÊN CÙNG ============ -->
<nav th:fragment="navbar" class="navbar">

    <!-- KHO ICON (Lucide) - khai báo 1 lần, dùng ở mọi trang -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-home" viewBox="0 0 24 24">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
            <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </symbol>
        <symbol id="i-newspaper" viewBox="0 0 24 24">
            <path d="M15 18h-5"/><path d="M18 14h-8"/>
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/>
            <rect width="8" height="4" x="10" y="6" rx="1"/>
        </symbol>
        <symbol id="i-pen" viewBox="0 0 24 24">
            <path d="M12 20h9"/>
            <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/>
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </symbol>
        <symbol id="i-user-plus" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>
        </symbol>
        <symbol id="i-user-minus" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <line x1="22" x2="16" y1="11" y2="11"/>
        </symbol>
        <symbol id="i-login" viewBox="0 0 24 24">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/>
        </symbol>
        <symbol id="i-logout" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <path d="M5 12h14"/><path d="M12 5v14"/>
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24">
            <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
            <path d="m15 5 4 4"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
            <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            <line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>
        </symbol>
        <symbol id="i-send" viewBox="0 0 24 24">
            <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
            <path d="m21.854 2.147-10.94 10.939"/>
        </symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </symbol>
    </svg>

    <div class="navbar-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-logo">S</span>
            <span class="brand-name">Social Demo</span>
        </a>

        <div class="nav-links">
            <a th:href="@{/}"><svg class="icon"><use href="#i-home"/></svg> Trang chủ</a>
            <a th:href="@{/feed}"><svg class="icon"><use href="#i-newspaper"/></svg> Bảng tin</a>
            <a th:href="@{/posts}"><svg class="icon"><use href="#i-pen"/></svg> Bài viết</a>
            <a th:href="@{/users}"><svg class="icon"><use href="#i-users"/></svg> Mọi người</a>
        </div>

        <div class="nav-auth">
            <th:block th:if="${session.currentUser != null}">
                <span class="nav-user">
                    <span class="avatar avatar-sm"
                          th:text="${#strings.toUpperCase(#strings.substring(session.currentUser.username,0,1))}">K</span>
                    <b th:text="${session.currentUser.username}">khoa</b>
                </span>
                <a class="btn btn-outline btn-sm" th:href="@{/logout}">
                    <svg class="icon"><use href="#i-logout"/></svg> Đăng xuất
                </a>
            </th:block>
            <th:block th:unless="${session.currentUser != null}">
                <a class="btn btn-ghost btn-sm" th:href="@{/login}">
                    <svg class="icon"><use href="#i-login"/></svg> Đăng nhập
                </a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">
                    <svg class="icon"><use href="#i-user-plus"/></svg> Đăng ký
                </a>
            </th:block>
        </div>
    </div>
</nav>

<!-- ============ SIDEBAR TRÁI ============ -->
<aside th:fragment="sidebar" class="sidebar">
    <div class="card profile-card" th:if="${session.currentUser != null}">
        <span class="avatar avatar-lg"
              th:text="${#strings.toUpperCase(#strings.substring(session.currentUser.username,0,1))}">K</span>
        <h3 th:text="${session.currentUser.username}">khoa</h3>
        <span class="badge" th:text="${session.currentUser.role}">USER</span>
    </div>
    <div class="card menu-card">
        <a class="menu-item" th:href="@{/}"><svg class="icon"><use href="#i-home"/></svg> Trang chủ</a>
        <a class="menu-item" th:href="@{/feed}"><svg class="icon"><use href="#i-newspaper"/></svg> Bảng tin</a>
        <a class="menu-item" th:href="@{/posts}"><svg class="icon"><use href="#i-pen"/></svg> Bài viết</a>
        <a class="menu-item" th:href="@{/users}"><svg class="icon"><use href="#i-users"/></svg> Mọi người</a>
    </div>
</aside>

<!-- ============ FOOTER ============ -->
<footer th:fragment="footer" class="footer">
    <p>Nhóm 3 · Demo Spring MVC</p>
</footer>

</body>
</html>

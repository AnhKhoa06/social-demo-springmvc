<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bảng tin')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="layout">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>

        <main class="main">
            <div class="card">
                <h2 class="card-title">Bảng tin theo dõi</h2>
                <p class="user-meta" style="margin:0;">Bài viết mới nhất từ những người bạn đang theo dõi</p>
            </div>

            <!-- Chưa có bài nào -->
            <div class="card empty-state" th:if="${#lists.isEmpty(posts)}">
                <p>Bảng tin của bạn chưa có bài viết nào.</p>
                <p>Hãy theo dõi người dùng khác để xem bài viết của họ tại đây.</p>
                <a class="btn btn-primary" th:href="@{/users}">
                    <svg class="icon"><use href="#i-users"/></svg> Khám phá người dùng
                </a>
            </div>

            <!-- Danh sách bài viết -->
            <div class="card" th:each="post : ${posts}">
                <div class="post-header">
                    <!-- Nhấn vào Avatar chuyển tới trang bài viết của User -->
                    <a th:href="@{/feed/users/{id}(id=${post.user.id})}" style="text-decoration: none;">
                        <span class="avatar avatar-md"
                              th:text="${post.user != null ? #strings.toUpperCase(#strings.substring(post.user.username,0,1)) : '?'}">K</span>
                    </a>
                    <div>
                        <!-- Nhấn vào Tên chuyển tới trang bài viết của User -->
                        <a th:href="@{/feed/users/{id}(id=${post.user.id})}" class="post-author" style="text-decoration: none; color: inherit;"
                           th:text="${post.user != null ? post.user.username : 'Ẩn danh'}">Tác giả</a>
                           
                        <div class="post-time"
                             th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}">09/10/2026 14:53</div>
                    </div>
                </div>
                <div class="post-title" th:text="${post.title}">Tiêu đề</div>
                <div class="post-body" th:text="${post.body}">Nội dung bài viết</div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

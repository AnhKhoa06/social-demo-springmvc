<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bảng Tin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container { max-width: 680px; margin: 30px auto; padding: 0 15px; font-family: system-ui, sans-serif; }
        /* .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; margin-bottom: 20px; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #007bff; font-weight: 500; }
        .nav-links a.active { color: #222; font-weight: bold; } */
        .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .empty-box { text-align: center; padding: 40px; background: #fff; border: 1px dashed #ccc; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body style="background-color: #f7f9fa; margin: 0;">

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <h2>Bảng tin theo dõi</h2>

        <!-- Khi không có bài viết nào -->
        <div th:if="${#lists.isEmpty(posts)}" class="empty-box">
            <p style="color: #555; font-size: 16px; margin-bottom: 8px;">Bảng tin của bạn chưa có bài viết nào.</p>
            <p style="color: #888; font-size: 14px; margin-top: 0;">Hãy theo dõi người dùng khác để xem bài viết của họ tại đây!</p>
            <a th:href="@{/users}" style="display: inline-block; margin-top: 10px; padding: 8px 16px; background: #007bff; color: #fff; text-decoration: none; border-radius: 4px;">Khám phá người dùng</a>
        </div>

        <!-- Danh sách bài viết -->
        <div th:unless="${#lists.isEmpty(posts)}">
            <div th:each="post : ${posts}" class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px;">
                    <span style="font-weight: bold; color: #007bff;" th:text="${post.user != null ? post.user.username : 'Ẩn danh'}">Tác giả</span>
                    <span style="font-size: 12px; color: #888;" th:text="${post.createdAt}">Thời gian</span>
                </div>
                <h3 style="margin: 0 0 10px 0;" th:text="${post.title}">Tiêu đề</h3>
                <p style="color: #333; line-height: 1.5; white-space: pre-wrap; margin: 0;" th:text="${post.body}">Nội dung bài viết</p>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

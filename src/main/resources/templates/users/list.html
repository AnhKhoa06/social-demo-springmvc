<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Người Dùng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container { max-width: 680px; margin: 30px auto; padding: 0 15px; font-family: system-ui, sans-serif; }
        /* .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; margin-bottom: 20px; }
        .nav-links a { margin-left: 15px; text-decoration: none; color: #007bff; font-weight: 500; }
        .nav-links a.active { color: #222; font-weight: bold; } */
        .table-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; margin-top: 15px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
    </style>
</head>
<body style="background-color: #f7f9fa; margin: 0;">

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container">
        <h2>Khám phá người dùng</h2>
        <p style="color: #666; margin-top: 4px;">Danh sách tất cả thành viên trên hệ thống</p>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Tên người dùng</th>
                        <th>Người theo dõi</th>
                        <th style="text-align: right;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td style="font-weight: 500;" th:text="${user.username}">username</td>
                        <td style="color: #666;" 
                            th:text="${(followerCounts[user.id] != null ? followerCounts[user.id] : 0) + ' người theo dõi'}">
                            0 người theo dõi
                        </td>
                        <td style="text-align: right;">
                            <form th:if="${#lists.contains(followedUserIds, user.id)}" th:action="@{/users/unfollow}" method="post" style="display:inline;">
                                <input type="hidden" name="userId" th:value="${user.id}" />
                                <button type="submit" style="padding: 6px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Bỏ theo dõi</button>
                            </form>
                            <form th:unless="${#lists.contains(followedUserIds, user.id)}" th:action="@{/users/follow}" method="post" style="display:inline;">
                                <input type="hidden" name="userId" th:value="${user.id}" />
                                <button type="submit" style="padding: 6px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Theo dõi</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="3" style="text-align: center; padding: 20px; color: #888;">Không có người dùng nào khác.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

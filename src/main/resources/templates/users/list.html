<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mọi người')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="layout">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>

        <main class="main">
            <div class="card">
                <h2 class="card-title">Khám phá người dùng</h2>
                <p class="user-meta" style="margin:0;">Danh sách tất cả thành viên trên hệ thống</p>
            </div>

            <div class="card">
                <div class="user-row" th:each="user : ${users}">
                    <span class="avatar avatar-md"
                          th:text="${#strings.toUpperCase(#strings.substring(user.username,0,1))}">K</span>

                    <div class="user-info">
                        <div class="user-name" th:text="${user.username}">username</div>
                        <div class="user-meta"
                             th:text="${(followerCounts[user.id] != null ? followerCounts[user.id] : 0) + ' người theo dõi'}">
                            0 người theo dõi
                        </div>
                    </div>

                    <!-- Đang theo dõi -> nút Bỏ theo dõi -->
                    <form th:if="${#lists.contains(followedUserIds, user.id)}"
                          th:action="@{/users/unfollow}" method="post">
                        <input type="hidden" name="userId" th:value="${user.id}"/>
                        <button type="submit" class="btn btn-danger btn-sm">
                            <svg class="icon"><use href="#i-user-minus"/></svg> Bỏ theo dõi
                        </button>
                    </form>

                    <!-- Chưa theo dõi -> nút Theo dõi -->
                    <form th:unless="${#lists.contains(followedUserIds, user.id)}"
                          th:action="@{/users/follow}" method="post">
                        <input type="hidden" name="userId" th:value="${user.id}"/>
                        <button type="submit" class="btn btn-primary btn-sm">
                            <svg class="icon"><use href="#i-user-plus"/></svg> Theo dõi
                        </button>
                    </form>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(users)}">
                    Không có người dùng nào khác.
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
